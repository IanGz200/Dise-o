<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 9</title>
    <style>
        .uno{
            padding: 10px;
        }
        .dos{
            padding: 10px 15px;
        }
        .tres{
            padding: 10px 15px 20px;
        }
        button {
             padding-top: 16px;
             padding-right: 20px;
             padding-bottom: 15px;
             padding-left: 10px;
         }
    </style>
</head>
<body>
    <p class="uno">parrafo con un padding de 10 pixeles</p>
    <p class="dos">parrafo con un padding de 10 pixeles arriba y abajo y 15 a izquierda y derecha</p>
    <p class="tres">parrafo con un padding de 10 pixeles arriba, de 15 izquierda y derecha y 20 abajo</p>
    <button type="button">Boton</button>
</body>
</html>
