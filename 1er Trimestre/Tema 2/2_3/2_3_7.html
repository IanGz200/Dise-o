<!DOCTYPE html>
<html>
    <head>
        <style>
            #parrafo1{

                background-color: lightblue;
                color: black;
                padding: 40px;
                text-align: left;
            }

            .estilo1{
                background-color: tomato;
                color: white;
                padding: 10px;
            }
        </style>
    </head>
    <body>
        <pre id="parrafo1">
            Este párrafo tiene el id:
            parrafo1 y ningun otro elemento
            podrá usar este id
        </pre>
        <pre class="estilo1">
            Este párrafo pertenece a la clase estilo1,
            la cual puede ser usada por otros elementos
        </pre>
        <p class="estilo1">
            Esto otro párrafo utiliza tambien la clase estilo1
        </p>
    </body>
</html>
