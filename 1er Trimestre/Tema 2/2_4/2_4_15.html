<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Ejercicio 15</title>
        <style>
            .hijo1{
                position: static;
            }
            .hijo2{
                position: relative;
            }
            .hijo3{
                position: fixed;
            }
            .hijo4{
                position: absolute;
            }
            .hijo5{
                position: sticky;
            }
        </style>
    </head>
    <body>
        <div class="contenedor">
            <p class="hijo1">Soy el hijo 1</p>
            <p class="hijo2">Soy el hijo 2</p>
            <p class="hijo3">Soy el hijo 3</p>
            <p class="hijo4">Soy el hijo 4</p>
            <p class="hijo5">Soy el hijo 5</p>
        </div>
    </body>
</html>
