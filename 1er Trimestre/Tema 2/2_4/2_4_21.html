<!DOCTYPE html>
<html lang="es">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Ejercicio 21</title>
        <style>
            .ele1 {
                width: 300px;
                height: 300px;
                position: absolute;
                background-color: blue;
                z-index: 1;
                align-content: end;
                color: white;
            }
            .ele2 {
                width: 200px;
                height: 200px;
                position: absolute;
                background-color: red;
                z-index: 2;
                align-content: end;
            }
            .ele3 {
                width: 100px;
                height: 100px;
                position: absolute;
                background-color: green;
                z-index: 3;
            }
            .ele4 {
                width: 300px;
                height: 50px;
                position: absolute;
                background-color: grey;
                z-index: 2;
                text-align: right;
            }
            .ele5 {
                width: 300px;
                overflow: hidden;
            }
            .invisible {
                visibility: hidden;
            }
        </style>
    </head>
    <body>
        <p class="ele1">Elemento 1</p>
        <p class="ele2">Elemento 2</p>
        <p class="ele3">Elemento 3</p>
        <p class="ele4">Elemento 4</p>
        <p class="ele5">Elemento 5 que contiene mucho texto para lo que se puede mostrar</p>
        <p class="invisible">Elemento Invisible</p>
    </body>
</html>
