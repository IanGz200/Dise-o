<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ejercicio 8</title>
    <style>
        .rectangle{
            width: 400px;
            height: 300px;
            background-color: red;
        }
        .rectangle:hover{
            animation: reduction 1s forwards;
        }
        @keyframes reduction {
            99%{
                background-color: red;
            }
            to{
                scale: 0.5;
                background-color: blue;
            }
        }
    </style>
</head>
<body>
<div class="rectangle"></div>
</body>
</html>
